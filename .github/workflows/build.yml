name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore
        run: dotnet restore Jellyfin.Plugin.DataFlow.sln
      - name: Build
        run: dotnet build Jellyfin.Plugin.DataFlow.sln -c Release --no-restore
      - name: Test
        run: dotnet test Jellyfin.Plugin.DataFlow.sln -c Release --no-build --logger "trx"
      - name: Package
        run: bash scripts/package.sh Release
      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: |
            artifacts/*.zip
            artifacts/manifest.json
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/manifest.json
